<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>빌려대학 (LENDU)</title>
    <style>
        /* 꾸미기 없음 - 와이어프레임 영역 구분용 최소 선 */
        body { font-family: sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 15px; margin-bottom: 20px; }
        nav a { margin-left: 15px; text-decoration: none; color: #000; font-weight: bold; }
        .box { border: 1px solid #000; padding: 20px; margin-bottom: 20px; }
        .grid { display: flex; gap: 20px; }
        .card { border: 1px solid #000; padding: 15px; width: 30%; }
        .img-placeholder { border: 1px dashed #666; height: 120px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        button { padding: 5px 12px; cursor: pointer; background: #fff; border: 1px solid #000; }
    </style>
</head>
<body>

    <header>
        <div><a href="/" style="font-size: 24px; font-weight: bold; text-decoration: none; color: #000;">빌려대학</a></div>
        <nav>
            <a href="/items">물품 찾기</a>
            <a href="/lend">빌려주기</a>
            <a href="/manage">거래 관리</a>
            <a href="/mypage">마이페이지</a>
            {% if current_user.is_logged_in %}
                <a href="/logout" onclick="return confirm('로그아웃 하시겠습니까?');">로그아웃 ({{ current_user.name }})</a>
            {% else %}
                <a href="/login">로그인</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
