{% extends "base.html" %}

{% block content %}
    <h2>요청 글 상세</h2>

    <div class="box">
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #ccc; padding-bottom: 10px; margin-bottom: 15px;">
            <div>
                <span style="font-size: 13px; color: #555;">작성자: {{ req.writer }}</span>
                <h3 style="margin: 5px 0;">{{ req.title }}</h3>
            </div>
            <div>
                <button onclick="alert('수정 기능 연결 예정')">수정</button>
                <button onclick="alert('삭제 확인 팝업 연결 예정')">삭제</button>
            </div>
        </div>

        <div style="min-height: 150px; margin-bottom: 20px;">
            {{ req.content }}
        </div>

        <div style="display: flex; justify-content: space-between; border-top: 1px solid #ccc; padding-top: 15px;">
            <a href="/lend"><button type="button">목록</button></a>
            <div style="display: flex; gap: 10px;">
                <form method="POST" onsubmit="return confirm('이 요청자에게 물품을 빌려주겠다고 요청을 보내시겠습니까?');">
                    <button type="submit" style="font-weight: bold;">빌려주기</button>
                </form>
                <a href="/manage"><button type="button">채팅하기</button></a>
            </div>
        </div>
    </div>
{% endblock %}
