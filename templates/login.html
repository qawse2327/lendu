{% extends "base.html" %}

{% block content %}
    <div class="box" style="max-width: 400px; margin: 40px auto;">
        <h2 style="text-align: center;">로그인 / 회원가입</h2>

        <form method="POST">
            <div style="margin-bottom: 12px;">
                <input type="text" name="user_id" placeholder="아이디 입력" required style="width: 100%; padding: 10px; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 15px;">
                <input type="password" name="password" placeholder="비밀번호 입력" required style="width: 100%; padding: 10px; box-sizing: border-box;">
            </div>

            <button type="submit" style="width: 100%; padding: 10px; font-weight: bold; margin-bottom: 15px;">로그인</button>

            <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 15px;">
                <a href="#" onclick="alert('아이디/비밀번호 찾기 팝업 예정')" style="color: #000;">아이디/비밀번호 찾기</a>
                <a href="/signup" style="color: #000; font-weight: bold;">회원가입</a>
            </div>

            <div>
                <label style="font-size: 13px;"><input type="checkbox" checked> 자동 로그인</label>
            </div>
        </form>
    </div>
{% endblock %}
